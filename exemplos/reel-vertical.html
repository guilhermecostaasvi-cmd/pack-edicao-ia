<!doctype html>
<!-- PACK EDIÇÃO IA · showreel vertical (9:16): as animações de criativo montadas num reels de exemplo.

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0f; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #1d1d26 0%, #0b0b0f 70%); }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="21" data-width="1080" data-height="1920">

      window.__timelines = window.__timelines || {};
      window.__timelines["reel"] = gsap.timeline({ paused: true });
