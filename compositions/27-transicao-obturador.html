<!-- PACK EDIÇÃO IA · 27 transição obturador de câmera (overlay, fundo transparente)
     Base: bloco "transitions-mechanical" (shutter/iris) e "editorial-flash-overlay" do catálogo HyperFrames (Apache-2.0).
     As lâminas da lente fecham, a tela fica preta, "clique" com flash e abre na próxima cena.
     Tela 100% coberta em 0,40 s a 0,46 s: faça o corte entre as duas cenas nesse intervalo. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"laminas","type":"number","label":"Número de lâminas (5 a 9)","default":7},
  {"id":"flash","type":"boolean","label":"Flash branco no clique","default":true},
  {"id":"cor","type":"color","label":"Cor das lâminas","default":"#141417"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #lente { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="27-transicao-obturador" data-start="0" data-duration="0.95" data-width="1920" data-height="1080">
      <canvas id="lente" width="1920" height="1080"></canvas>
      <div id="flash"></div>
      <audio id="som27-1" data-start="0.05" data-duration="0.4" src="../assets/sfx/zoom-in.wav" data-volume="0.25"></audio>
      <audio id="som27-2" data-start="0.36" data-duration="0.47" src="../assets/sfx/obturador.wav" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const N = Math.round(Math.max(5, Math.min(9, Number(v.laminas ?? 7))));
      const FLASH = v.flash ?? true;
      const COR = v.cor ?? "#141417";
      const cv = document.querySelector("#lente"), g = cv.getContext("2d");
      const CX = 960, CY = 540, RMAX = 1250, L = 3200;
      const estado = { r: RMAX };

      function tom(hex, k) { // clareia/escurece a cor das lâminas
        const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((x) => Math.max(0, Math.min(255, Math.round(x + k))));
        return `rgb(${c[0]},${c[1]},${c[2]})`;
      }
      function desenha() {
        const r = estado.r;
        g.clearRect(0, 0, 1920, 1080);
        if (r >= RMAX - 1) return;
        // a abertura gira enquanto fecha, como uma íris de verdade
        const giro = 0.35 + 1.1 * (1 - r / RMAX);
        const vs = [];
        for (let i = 0; i < N; i++) { const a = giro + (i * 2 * Math.PI) / N; vs.push([CX + r * Math.cos(a), CY + r * Math.sin(a)]); }
        for (let i = 0; i < N; i++) {
          const a = vs[i], b = vs[(i + 1) % N];
          let dx = a[0] - b[0], dy = a[1] - b[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
          const c = vs[(i + 2) % N];
          let ex = b[0] - c[0], ey = b[1] - c[1]; const m2 = Math.hypot(ex, ey) || 1; ex /= m2; ey /= m2;
          // cada lâmina: da aresta da abertura até bem longe, na direção da aresta
          g.beginPath();
          g.moveTo(a[0], a[1]);
          g.lineTo(a[0] + dx * L, a[1] + dy * L);
          g.lineTo(b[0] + ex * L, b[1] + ey * L);
          g.lineTo(b[0], b[1]);
          g.closePath();
          const gr = g.createLinearGradient(a[0], a[1], a[0] + dx * 900, a[1] + dy * 900);
          gr.addColorStop(0, tom(COR, i % 2 ? 22 : 12));
          gr.addColorStop(1, tom(COR, i % 2 ? 4 : -4));
          g.fillStyle = gr;
          g.fill();
          // fio de luz na borda de cada lâmina
          g.strokeStyle = "rgba(255,255,255,0.10)";
          g.lineWidth = 2;
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(a[0] + dx * L, a[1] + dy * L); g.stroke();
        }
        // sombra interna na abertura
        if (r > 2) {
          const sh = g.createRadialGradient(CX, CY, r * 0.55, CX, CY, r * 1.05);
          sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,0.35)");
          g.save(); g.beginPath(); vs.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.clip();
          g.fillStyle = sh; g.fillRect(0, 0, 1920, 1080); g.restore();
        } else {
          g.fillStyle = tom(COR, -6); g.fillRect(0, 0, 1920, 1080);
        }
      }

      // um relógio só: o raio sai do tempo, então funciona com o render pulando pra qualquer quadro
      const cl = (x) => Math.min(1, Math.max(0, x));
      const raio = (t) => {
        if (t < 0.4) { const k = cl(t / 0.4); return RMAX * (1 - k * k * k); }         // fecha
        if (t < 0.46) return 0;                                                          // preto
        const k = cl((t - 0.46) / 0.45); return RMAX * (1 - Math.pow(1 - k, 3));        // abre
      };
      const relogio = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(relogio, { t: 0.95, duration: 0.95, ease: "none", onUpdate: () => { estado.r = raio(relogio.t); desenha(); } }, 0);
      if (FLASH) {
        tl.to("#flash", { opacity: 0.9, duration: 0.03, ease: "none" }, 0.44);
        tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.47);
      }
      window.__timelines["27-transicao-obturador"] = tl;
      desenha();
    </script>
  </body>
</html>
