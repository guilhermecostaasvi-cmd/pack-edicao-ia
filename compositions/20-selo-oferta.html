<!-- PACK EDIÇÃO IA · 20 selo de oferta "de/por" (vertical 9:16, overlay transparente)
     Base: componentes "strikethrough-replace", "spring-pop" e "number-wheel" do catálogo HyperFrames (Apache-2.0).
     Use só com preço e condição reais: preço "de" inventado é propaganda enganosa. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"preco_de","type":"string","label":"Preço antigo","default":"R$ 197"},
  {"id":"preco_por","type":"string","label":"Preço novo","default":"R$ 47"},
  {"id":"chamada","type":"string","label":"Chamada no selo","default":"OFERTA"},
  {"id":"rodape","type":"string","label":"Linha de baixo","default":"pagamento único · acesso imediato"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--pk-fonte); }
      #card { position: absolute; left: 90px; right: 90px; bottom: 420px; padding: 50px 40px 46px; border-radius: 40px; background: #0b0b0f; color: #fff; text-align: center;
        box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.08); }
      #selo { position: absolute; top: -56px; right: 40px; width: 150px; height: 150px; border-radius: 50%; background: var(--pk-acento); color: #0b0b0f; display: grid; place-items: center;
        font-weight: 900; font-size: 30px; letter-spacing: .02em; transform: rotate(12deg); box-shadow: 0 16px 30px rgba(0,0,0,.35); }
      #selo::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 3px dashed rgba(0,0,0,.35); }
      #de { position: relative; display: inline-block; font-size: 72px; font-weight: 700; color: #a1a1aa; }
      #de .risco { position: absolute; left: -6%; right: -6%; top: 52%; height: 9px; background: #ef4444; border-radius: 5px; transform-origin: 0 50%; }
      #rot { font-size: 34px; font-weight: 600; color: #a1a1aa; margin: 8px 0 -6px; }
      #por { font-size: 180px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: #3ddc84; }
      #rodape { font-size: 30px; font-weight: 500; color: #d4d4d8; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="20-selo-oferta" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="card">
        <div id="selo"><span id="cham">OFERTA</span></div>
        <div id="de"><span id="devalor">R$ 197</span><div class="risco"></div></div>
        <div id="rot">por apenas</div>
        <div id="por">R$ 47</div>
        <div id="rodape">pagamento único · acesso imediato</div>
      </div>
      <audio id="som20-1" data-start="0" data-duration="0.55" src="../assets/sfx/whoosh-curto.wav" data-volume="0.5"></audio>
      <audio id="som20-2" data-start="0.75" data-duration="0.25" src="../assets/sfx/swipe.wav" data-volume="0.6"></audio>
      <audio id="som20-3" data-start="1.05" data-duration="1.5" src="../assets/sfx/slam-texto.wav" data-volume="0.6"></audio>
      <audio id="som20-4" data-start="1.1" data-duration="2.4" src="../assets/sfx/cha-ching.wav" data-volume="0.7"></audio>
      <audio id="som20-5" data-start="1.55" data-duration="0.18" src="../assets/sfx/pop-bolha.wav" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const $ = (s) => document.querySelector(s);
      $("#devalor").textContent = v.preco_de ?? "R$ 197";
      $("#por").textContent = v.preco_por ?? "R$ 47";
      $("#cham").textContent = v.chamada ?? "OFERTA";
      $("#rodape").textContent = v.rodape ?? "pagamento único · acesso imediato";

      gsap.set("#de .risco", { scaleX: 0, rotation: -7 });
      const tl = gsap.timeline({ paused: true });
      tl.from("#card", { y: 300, opacity: 0, duration: 0.5, ease: "back.out(1.4)" }, 0);
      tl.from("#de", { y: 20, opacity: 0, duration: 0.3, ease: "power3.out" }, 0.25);
      tl.to("#de .risco", { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0.75);
      tl.to("#de", { opacity: 0.55, duration: 0.2 }, 0.95);
      tl.from("#rot", { opacity: 0, duration: 0.2 }, 0.95);
      tl.fromTo("#por", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 0.85);
      tl.to("#card", { keyframes: [{ x: -10, y: 6 }, { x: 8, y: -4 }, { x: -3, y: 2 }, { x: 0, y: 0 }], duration: 0.14 }, 1.1);
      tl.from("#rodape", { y: 14, opacity: 0, duration: 0.3, ease: "power2.out" }, 1.25);
      tl.fromTo("#selo", { scale: 0, rotation: -40 }, { scale: 1, rotation: 12, duration: 0.45, ease: "back.out(2.6)" }, 1.5);
      tl.to("#selo", { rotation: 4, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.0);
      tl.to("#por", { scale: 1.05, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.2);
      tl.to("#card", { y: 300, opacity: 0, duration: 0.35, ease: "power3.in" }, 4.1);
      window.__timelines["20-selo-oferta"] = tl;
    </script>
  </body>
</html>
