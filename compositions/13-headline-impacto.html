<!-- PACK EDIÇÃO IA · 13 frase de impacto que "bate" na tela (overlay, fundo transparente)
     Base: componentes "headline-slam" e "beat-accent" do catálogo HyperFrames (Apache-2.0).
     Use nas frases de virada. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"linha1","type":"string","label":"Linha 1","default":"NÃO É FERRAMENTA."},
  {"id":"linha2","type":"string","label":"Linha 2 (destaque)","default":"É FUNCIONÁRIO."},
  {"id":"escurecer","type":"boolean","label":"Escurecer o vídeo atrás","default":true}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--pk-fonte); }
      #escuro { position: absolute; inset: 0; background: rgba(5,5,8,.62); opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #pilha { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .l { font-size: 150px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: #fff; white-space: nowrap; text-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #l2 { color: var(--pk-acento); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="13-headline-impacto" data-start="0" data-duration="2.8" data-width="1920" data-height="1080">
      <div id="escuro"></div>
      <div id="flash"></div>
      <div id="pilha"><div class="l" id="l1">NÃO É FERRAMENTA.</div><div class="l" id="l2">É FUNCIONÁRIO.</div></div>
      <audio id="som13-1" data-start="0" data-duration="1.5" src="../assets/sfx/slam-texto.wav" data-volume="0.7"></audio>
      <audio id="som13-2" data-start="0.55" data-duration="1.6" src="../assets/sfx/impacto-grave.wav" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      document.querySelector("#l1").textContent = v.linha1 ?? "NÃO É FERRAMENTA.";
      const L2 = v.linha2 ?? "É FUNCIONÁRIO.";
      if (L2) document.querySelector("#l2").textContent = L2; else document.querySelector("#l2").style.display = "none";
      const ESC = v.escurecer ?? true;

      // ajusta o tamanho pra frase longa nunca sair da tela
      document.querySelectorAll(".l").forEach((el) => { const w = el.scrollWidth; if (w > 1720) el.style.fontSize = Math.floor(150 * 1720 / w) + "px"; });

      const tl = gsap.timeline({ paused: true });
      if (ESC) tl.to("#escuro", { opacity: 1, duration: 0.2 }, 0);
      tl.fromTo("#l1", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 0);
      tl.to("#l1", { keyframes: [{ x: -10, y: 6 }, { x: 8, y: -5 }, { x: -4, y: 3 }, { x: 0, y: 0 }], duration: 0.12 }, 0.22);
      tl.fromTo("#l2", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 0.55);
      tl.to("#flash", { opacity: 0.35, duration: 0.03 }, 0.77);
      tl.to("#flash", { opacity: 0, duration: 0.25 }, 0.8);
      tl.to("#pilha", { keyframes: [{ x: -14, y: 8 }, { x: 12, y: -6 }, { x: -6, y: 4 }, { x: 0, y: 0 }], duration: 0.14 }, 0.77);
      tl.to("#pilha", { scale: 1.04, duration: 1.6, ease: "none" }, 0.9);
      tl.to(["#pilha", "#escuro"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.5);
      window.__timelines["13-headline-impacto"] = tl;
    </script>
  </body>
</html>
