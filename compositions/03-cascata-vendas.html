<!-- PACK EDIÇÃO IA · 03 cascata de vendas (vertical 9:16, pra criativo e reels)
     Base: bloco "notification-cascade" do catálogo HyperFrames (Apache-2.0), adaptado pra vendas em R$. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"valor_venda","type":"number","label":"Valor de cada venda","default":47},
  {"id":"produto","type":"string","label":"Nome do produto","default":"Guia Completo"},
  {"id":"rotulo_total","type":"string","label":"Rótulo do total","default":"vendido agora há pouco"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--pk-fonte); color: #fff;
        background: radial-gradient(ellipse at 30% 10%, #1d3b2c 0%, transparent 55%), radial-gradient(ellipse at 80% 90%, #10233a 0%, transparent 60%), #07080b; }
      #hora { position: absolute; top: 150px; width: 100%; text-align: center; font-size: 190px; font-weight: 600; letter-spacing: -0.03em; opacity: .95; }
      #data { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 36px; font-weight: 500; color: rgba(255,255,255,.75); }
      #total { position: absolute; top: 410px; width: 100%; text-align: center; }
      #total .n { font-size: 96px; font-weight: 900; color: #3ddc84; font-variant-numeric: tabular-nums; text-shadow: 0 10px 40px rgba(61,220,132,.35); }
      #total .r { font-size: 32px; font-weight: 600; color: rgba(255,255,255,.7); margin-top: 4px; }
      #pilha { position: absolute; left: 40px; right: 40px; top: 640px; }
      .notif { position: absolute; left: 0; right: 0; height: 150px; border-radius: 34px; padding: 24px 28px;
        background: rgba(40, 40, 46, 0.78); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 20px 40px rgba(0,0,0,.35);
        display: grid; grid-template-columns: 84px 1fr auto; gap: 4px 22px; align-items: center; opacity: 0; }
      .notif .ic { grid-row: span 2; width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(145deg, #34d27b, #12924a); display: grid; place-items: center; font-weight: 900; font-size: 30px; color: #06381c; }
      .notif .t { font-size: 34px; font-weight: 700; }
      .notif .q { font-size: 26px; color: rgba(255,255,255,.7); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .notif .h { grid-row: span 2; align-self: start; font-size: 24px; color: rgba(255,255,255,.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="03-cascata-vendas" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="data">quarta-feira, 21 de outubro</div>
      <div id="hora">10:00</div>
      <div id="total"><div class="n" id="num">R$ 0</div><div class="r" id="rot">vendido agora há pouco</div></div>
      <div id="pilha"></div>
      <audio id="som03-1" data-start="0" data-duration="0.25" src="../assets/sfx/swipe.wav" data-volume="0.4"></audio>
      <audio id="som03-2" data-start="0.72" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.90"></audio>
      <audio id="som03-3" data-start="1.34" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.84"></audio>
      <audio id="som03-4" data-start="1.89" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.78"></audio>
      <audio id="som03-5" data-start="2.37" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.72"></audio>
      <audio id="som03-6" data-start="2.78" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.66"></audio>
      <audio id="som03-7" data-start="3.12" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.60"></audio>
      <audio id="som03-8" data-start="3.39" data-duration="1.41" src="../assets/sfx/notificacao-venda.wav" data-volume="0.54"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const VALOR = Number(v.valor_venda ?? 47);
      const QTD = 7; // fixo: os 7 sons de notificação estão marcados no HTML acima
      const PROD = v.produto ?? "Guia Completo";
      document.querySelector("#rot").textContent = v.rotulo_total ?? "vendido agora há pouco";
      const brl = (x) => "R$ " + x.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = document.querySelector("#num");
      const total = { x: 0 };
      const pinta = () => (num.textContent = brl(Math.round(total.x * 100) / 100));
      pinta();

      const pilha = document.querySelector("#pilha");
      const root = document.querySelector("#root");
      const cards = [];
      for (let i = 0; i < QTD; i++) {
        const c = document.createElement("div");
        c.className = "notif";
        c.innerHTML = `<div class="ic">R$</div><div class="t">Venda aprovada · ${brl(VALOR)}</div><div class="h">agora</div><div class="q">${PROD} · Pix</div>`;
        pilha.appendChild(c);
        cards.push(c);
      }

      const tl = gsap.timeline({ paused: true });
      tl.from(["#data", "#hora"], { y: -30, opacity: 0, duration: 0.6, stagger: 0.08, ease: "power3.out" }, 0);
      tl.from("#total", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.25);

      // cada nova notificação entra no topo e empurra as outras pra baixo, cada vez mais rápido
      let t = 0.7;
      const PASSO = 170;
      for (let i = 0; i < QTD; i++) {
        const gap = Math.max(0.22, 0.62 - i * 0.07);
        tl.fromTo(cards[i], { y: -70, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.5)" }, t);
        for (let j = 0; j < i; j++) {
          const pos = (i - j) * PASSO;
          tl.to(cards[j], { y: pos, scale: 1 - (i - j) * 0.03, opacity: Math.max(0.35, 1 - (i - j) * 0.13), duration: 0.38, ease: "power3.out" }, t);
        }
        tl.to(total, { x: VALOR * (i + 1), duration: 0.35, ease: "power2.out", onUpdate: pinta }, t + 0.05);
        tl.fromTo("#num", { scale: 1 }, { scale: 1.07, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t + 0.05);
        t += gap;
      }
      tl.to("#root", { opacity: 1, duration: 0.01 }, 5.99);
      window.__timelines["03-cascata-vendas"] = tl;
    </script>
  </body>
</html>
