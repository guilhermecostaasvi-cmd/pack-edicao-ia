<!-- PACK EDIÇÃO IA · 04 ROI em destaque
     Base: bloco "mk-progress-stat" do catálogo HyperFrames (Apache-2.0), adaptado pra investido × faturado. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"investido","type":"number","label":"Valor investido (R$)","default":2000},
  {"id":"retorno","type":"number","label":"Valor que voltou (R$)","default":6400},
  {"id":"rotulo","type":"string","label":"Rótulo do retorno","default":"faturado"},
  {"id":"titulo","type":"string","label":"Título","default":"ROI da campanha"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--pk-fonte); color: var(--pk-texto);
        background: radial-gradient(ellipse at 70% 40%, #14261c 0%, #0b0b0f 60%); }
      #titulo { position: absolute; top: 150px; left: 200px; font-family: var(--pk-mono); font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: var(--pk-cinza); }
      #grande { position: absolute; top: 210px; left: 190px; font-size: 330px; font-weight: 900; line-height: 1; letter-spacing: -0.04em; color: #3ddc84; font-variant-numeric: tabular-nums; }
      #grande small { font-size: .42em; font-weight: 800; margin-left: .06em; color: #3ddc84; }
      #barras { position: absolute; left: 200px; right: 200px; top: 640px; display: grid; gap: 34px; }
      .linha { display: grid; grid-template-columns: 300px 1fr 300px; align-items: center; gap: 30px; }
      .rot { font-size: 36px; font-weight: 600; color: var(--pk-cinza); text-transform: lowercase; }
      .trilho { height: 34px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
      .enche { height: 100%; width: 100%; border-radius: 999px; transform-origin: 0 50%; }
      #b1 .enche { background: #f97316; }
      #b2 .enche { background: linear-gradient(90deg, #22c55e, #3ddc84); }
      .val { font-size: 46px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
      #b2 .val { color: #3ddc84; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="04-roi-destaque" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
      <div id="titulo">ROI da campanha</div>
      <div id="grande"><span id="mult">0,0</span><small>x</small></div>
      <div id="barras">
        <div class="linha" id="b1"><div class="rot">investido</div><div class="trilho"><div class="enche"></div></div><div class="val" id="v1">R$ 0</div></div>
        <div class="linha" id="b2"><div class="rot" id="rot2">faturado</div><div class="trilho"><div class="enche"></div></div><div class="val" id="v2">R$ 0</div></div>
      </div>
      <audio id="som04-1" data-start="0" data-duration="0.55" src="../assets/sfx/whoosh-curto.wav" data-volume="0.5"></audio>
      <audio id="som04-2" data-start="0.5" data-duration="2" src="../assets/sfx/riser-2s.wav" data-volume="0.3"></audio>
      <audio id="som04-3" data-start="2.45" data-duration="1.5" src="../assets/sfx/slam-texto.wav" data-volume="0.8"></audio>
      <audio id="som04-4" data-start="2.5" data-duration="1.81" src="../assets/sfx/sucesso.wav" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const INV = Math.max(1, Number(v.investido ?? 2000));
      const RET = Math.max(0, Number(v.retorno ?? 6400));
      document.querySelector("#rot2").textContent = v.rotulo ?? "faturado";
      document.querySelector("#titulo").textContent = v.titulo ?? "ROI da campanha";
      const ROI = RET / INV;
      const maior = Math.max(INV, RET);
      const brl = (x) => "R$ " + Math.round(x).toLocaleString("pt-BR");
      const est = { inv: 0, ret: 0, roi: 0 };
      const pinta = () => {
        document.querySelector("#v1").textContent = brl(est.inv);
        document.querySelector("#v2").textContent = brl(est.ret);
        document.querySelector("#mult").textContent = est.roi.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      };
      pinta();
      if (ROI < 1) document.querySelector("#grande").style.color = "#ef4444";

      gsap.set("#barras .enche", { scaleX: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.from("#titulo", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.from("#barras .linha", { x: -40, opacity: 0, duration: 0.45, stagger: 0.12, ease: "power3.out" }, 0.15);
      tl.to("#b1 .enche", { scaleX: INV / maior, duration: 0.9, ease: "power3.out" }, 0.5);
      tl.to(est, { inv: INV, duration: 0.9, ease: "power3.out", onUpdate: pinta }, 0.5);
      tl.to("#b2 .enche", { scaleX: RET / maior, duration: 1.3, ease: "power2.inOut" }, 1.1);
      tl.to(est, { ret: RET, duration: 1.3, ease: "power2.inOut", onUpdate: pinta }, 1.1);
      tl.to(est, { roi: ROI, duration: 1.85, ease: "power2.inOut", onUpdate: pinta, onComplete: () => { est.roi = ROI; pinta(); } }, 0.6);
      tl.fromTo("#grande", { scale: 1 }, { scale: 1.06, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 70%" }, 2.45);
      tl.from("#grande", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to("#root > *", { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.1);
      window.__timelines["04-roi-destaque"] = tl;
    </script>
  </body>
</html>
