<!-- PACK EDIÇÃO IA · 21 antes × depois com divisória (vertical 9:16)
     Base: componentes "comparison-split" e "before-after-wipe" do catálogo HyperFrames (Apache-2.0).
     Com imagens: passe imagem_antes e imagem_depois (ex.: prints do gerenciador). Sem imagens: usa os números. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"imagem_antes","type":"string","label":"Imagem do antes (opcional)","default":""},
  {"id":"imagem_depois","type":"string","label":"Imagem do depois (opcional)","default":""},
  {"id":"titulo_antes","type":"string","label":"Rótulo do antes","default":"ANTES"},
  {"id":"titulo_depois","type":"string","label":"Rótulo do depois","default":"DEPOIS"},
  {"id":"numero_antes","type":"string","label":"Número do antes","default":"-R$ 1.000"},
  {"id":"numero_depois","type":"string","label":"Número do depois","default":"+R$ 5.000"},
  {"id":"legenda_antes","type":"string","label":"Legenda do antes","default":"mesma oferta no mercado A"},
  {"id":"legenda_depois","type":"string","label":"Legenda do depois","default":"mesma oferta no mercado B"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0f; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--pk-fonte); color: #fff; }
      .lado { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; }
      #antes { background: radial-gradient(ellipse at 50% 40%, #3a1414 0%, #120808 70%); }
      #depois { background: radial-gradient(ellipse at 50% 40%, #0f3a22 0%, #07120c 70%); clip-path: inset(0 0 0 100%); }
      .lado img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .rot { position: relative; font-family: var(--pk-mono); font-weight: 700; font-size: 44px; letter-spacing: .24em; padding: 12px 26px; border-radius: 10px; }
      #antes .rot { background: #ef4444; color: #fff; }
      #depois .rot { background: #22c55e; color: #06381c; }
      .num { position: relative; font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
      #antes .num { color: #ff6b6b; }
      #depois .num { color: #3ddc84; }
      .leg { position: relative; font-size: 40px; font-weight: 500; color: rgba(255,255,255,.75); max-width: 860px; }
      .com-img .num, .com-img .leg { display: none; }
      .com-img .rot { position: absolute; top: 260px; }
      #div { position: absolute; top: 0; bottom: 0; width: 10px; margin-left: -5px; left: 100%; background: #fff; box-shadow: 0 0 30px rgba(255,255,255,.6); }
      #div::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: #fff; color: #0b0b0f;
        display: grid; place-items: center; font-weight: 900; font-size: 44px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="21-antes-depois" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div class="lado" id="antes"><div class="rot" id="ra">ANTES</div><div class="num" id="na">-R$ 1.000</div><div class="leg" id="la">mesma oferta no mercado A</div></div>
      <div class="lado" id="depois"><div class="rot" id="rd">DEPOIS</div><div class="num" id="nd">+R$ 5.000</div><div class="leg" id="ld">mesma oferta no mercado B</div></div>
      <div id="div"></div>
      <audio id="som21-1" data-start="0.1" data-duration="0.35" src="../assets/sfx/erro-buzz.wav" data-volume="0.35"></audio>
      <audio id="som21-2" data-start="1.6" data-duration="1.1" src="../assets/sfx/whoosh-longo.wav" data-volume="0.6"></audio>
      <audio id="som21-3" data-start="2.55" data-duration="1.81" src="../assets/sfx/sucesso.wav" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const $ = (s) => document.querySelector(s);
      $("#ra").textContent = v.titulo_antes ?? "ANTES";
      $("#rd").textContent = v.titulo_depois ?? "DEPOIS";
      $("#na").textContent = v.numero_antes ?? "-R$ 1.000";
      $("#nd").textContent = v.numero_depois ?? "+R$ 5.000";
      $("#la").textContent = v.legenda_antes ?? "mesma oferta no mercado A";
      $("#ld").textContent = v.legenda_depois ?? "mesma oferta no mercado B";
      if (v.imagem_antes) { $("#antes").insertAdjacentHTML("afterbegin", `<img src="${v.imagem_antes}" alt="" />`); $("#antes").classList.add("com-img"); }
      if (v.imagem_depois) { $("#depois").insertAdjacentHTML("afterbegin", `<img src="${v.imagem_depois}" alt="" />`); $("#depois").classList.add("com-img"); }

      const prog = { p: 100 };
      const aplica = () => { $("#depois").style.clipPath = `inset(0 0 0 ${prog.p}%)`; $("#div").style.left = prog.p + "%"; };
      aplica();
      const tl = gsap.timeline({ paused: true });
      tl.from("#antes > *", { y: 40, opacity: 0, duration: 0.45, stagger: 0.1, ease: "power3.out" }, 0);
      tl.to("#antes .num", { keyframes: [{ x: -8 }, { x: 8 }, { x: -5 }, { x: 0 }], duration: 0.25 }, 0.5);
      tl.to(prog, { p: 0, duration: 1.0, ease: "power3.inOut", onUpdate: aplica }, 1.6);
      tl.from("#depois > *:not(img)", { scale: 0.85, opacity: 0, duration: 0.4, stagger: 0.08, ease: "back.out(2)" }, 2.4);
      tl.to("#div", { opacity: 0, duration: 0.3 }, 2.7);
      tl.fromTo("#depois .num", { scale: 1 }, { scale: 1.08, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.1);
      window.__timelines["21-antes-depois"] = tl;
    </script>
  </body>
</html>
