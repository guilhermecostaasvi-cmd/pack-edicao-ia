<!-- PACK EDIÇÃO IA · 25 texto que se monta com partículas (overlay, fundo transparente)
     Base: componentes "particle-text-dissolve" e "particle-image-reveal" do catálogo HyperFrames (Apache-2.0).
     Milhares de pontos de luz voam e formam a frase. Bom pra número grande, nome de produto, virada do vídeo.
     Tudo com semente fixa: sai igual em todo render. -->
<!doctype html>
<html lang="pt-BR" data-composition-variables='[
  {"id":"texto","type":"string","label":"Texto (curto, até ~14 letras)","default":"R$ 100 MIL"},
  {"id":"subtexto","type":"string","label":"Linha de baixo (opcional)","default":"em 30 dias"},
  {"id":"cor","type":"color","label":"Cor","default":"#ffd23f"},
  {"id":"saida","type":"boolean","label":"Desmanchar em partículas no fim","default":true}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--pk-fonte); }
      #po { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #nitido { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
      #txt { font-weight: 900; font-size: 210px; letter-spacing: -0.03em; line-height: 1; color: var(--cor); white-space: nowrap;
        text-shadow: 0 0 40px color-mix(in srgb, var(--cor) 55%, transparent), 0 10px 40px rgba(0,0,0,.45); }
      #sub { margin-top: 18px; font-weight: 700; font-size: 54px; color: #fff; letter-spacing: 0.01em; text-shadow: 0 6px 24px rgba(0,0,0,.6); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="25-particulas" data-start="0" data-duration="4.6" data-width="1920" data-height="1080">
      <canvas id="po" width="1920" height="1080"></canvas>
      <div id="nitido"><div id="txt"></div><div id="sub"></div></div>
      <audio id="som25-1" data-start="0.05" data-duration="2.5" src="../assets/sfx/brilho-particulas.wav" data-volume="0.7"></audio>
      <audio id="som25-2" data-start="1.75" data-duration="1.2" src="../assets/sfx/impacto-grave.wav" data-volume="0.55"></audio>
      <audio id="som25-3" data-start="3.75" data-duration="0.45" src="../assets/sfx/whoosh-saida.wav" data-volume="0.5"></audio>
    </div>
    <script>
      (function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
        const TEXTO = String(v.texto ?? "R$ 100 MIL");
        const SUB = String(v.subtexto ?? "em 30 dias");
        const COR = v.cor ?? "#ffd23f";
        const SAIDA = v.saida ?? true;
        const root = document.querySelector("#root");
        root.style.setProperty("--cor", COR);
        document.querySelector("#txt").textContent = TEXTO;
        document.querySelector("#sub").textContent = SUB;
        if (!SUB) document.querySelector("#sub").style.display = "none";
        const D = 4.6;

        // semente fixa
        let s = 20261021;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

        const cv = document.querySelector("#po"), g = cv.getContext("2d");
        let P = [];
        const relogio = { t: 0 };
        const cl = (x) => Math.min(1, Math.max(0, x));
        const outC = (x) => 1 - Math.pow(1 - cl(x), 3);
        const inQ = (x) => Math.pow(cl(x), 2);

        function monta() {
          // desenha o texto escondido e pega os pixels acesos: cada pixel vira um alvo de partícula
          const el = document.querySelector("#txt");
          const rr = root.getBoundingClientRect(), sc = rr.width / 1920 || 1, b = el.getBoundingClientRect();
          const r = { left: (b.left - rr.left) / sc, top: (b.top - rr.top) / sc, width: b.width / sc, height: b.height / sc };
          const off = document.createElement("canvas"); off.width = 1920; off.height = 1080;
          const o = off.getContext("2d");
          const cs = getComputedStyle(el);
          o.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          o.textBaseline = "alphabetic";
          o.fillStyle = "#fff";
          // alinha com o texto de verdade (mesma posição na tela)
          const m = o.measureText(TEXTO);
          const x0 = r.left + (r.width - m.width) / 2;
          const y0 = r.top + (r.height + m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
          o.fillText(TEXTO, x0, y0);
          const px = o.getImageData(0, 0, 1920, 1080).data;
          const passo = 5;
          for (let y = 0; y < 1080; y += passo) for (let x = 0; x < 1920; x += passo) {
            if (px[(y * 1920 + x) * 4 + 3] > 140) {
              const ang = rnd() * Math.PI * 2, dist = 500 + rnd() * 900;
              P.push({ tx: x, ty: y,
                sx: 960 + Math.cos(ang) * dist * 1.3, sy: 540 + Math.sin(ang) * dist * 0.8,
                atraso: 0.1 + 0.55 * ((x - x0) / Math.max(1, m.width)) + 0.35 * rnd(),
                giro: (rnd() - 0.5) * 260, tam: 1.6 + rnd() * 2.6, br: 0.55 + rnd() * 0.45,
                fx: (rnd() - 0.2) * 700, fy: -200 - rnd() * 600, fat: rnd() * 0.35 });
            }
          }
        }

        function desenha(t) {
          g.clearRect(0, 0, 1920, 1080);
          g.globalCompositeOperation = "lighter";
          g.fillStyle = COR;
          const nit = cl((t - 1.75) / 0.35);                 // texto nítido aparece
          const sai = SAIDA ? cl((t - 3.75) / 0.8) : 0;      // desmancha
          for (const p of P) {
            let k = outC((t - p.atraso) / 1.15);
            if (k <= 0) continue;
            const arco = Math.sin(Math.PI * k);
            const nx = -(p.ty - p.sy), ny = p.tx - p.sx, nm = Math.hypot(nx, ny) || 1;
            let x = p.sx + (p.tx - p.sx) * k + (nx / nm) * p.giro * arco;
            let y = p.sy + (p.ty - p.sy) * k + (ny / nm) * p.giro * arco;
            let a = p.br * Math.min(1, k * 3) * (1 - 0.85 * nit);
            if (sai > 0) {
              const q = inQ((sai - p.fat) / (1 - p.fat));
              x += p.fx * q; y += p.fy * q;
              a = p.br * Math.max(0, 1 - q) * (q > 0 ? 1 : 1 - 0.85 * nit);
            }
            if (a <= 0.01) continue;
            g.globalAlpha = a;
            const tm = p.tam * (1 + 1.5 * (1 - k));
            g.fillRect(x - tm / 2, y - tm / 2, tm, tm);
          }
          g.globalAlpha = 1;
          g.globalCompositeOperation = "source-over";
          // texto nítido some da esquerda pra direita junto com as partículas
          const n = document.querySelector("#nitido");
          n.style.opacity = nit;
          const corte = sai > 0 ? Math.round(sai * 115) : 0;
          n.style.clipPath = corte ? `inset(0 0 0 ${corte}%)` : "none";
          const sub = document.querySelector("#sub");
          const ks = outC((t - 2.0) / 0.4);
          sub.style.opacity = ks * (1 - cl(sai * 3));
          sub.style.transform = `translateY(${(1 - ks) * 24}px)`;
        }

        const tl = gsap.timeline({ paused: true });
        tl.to(relogio, { t: D, duration: D, ease: "none", onUpdate: () => P.length && desenha(relogio.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["25-particulas"] = tl;

        // espera a fonte carregar antes de ler os pixels do texto
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["25-particulas"] = document.fonts.load('900 210px "Poppins"', TEXTO).then(() => document.fonts.ready).then(() => { monta(); desenha(relogio.t); });
      })();
    </script>
  </body>
</html>
